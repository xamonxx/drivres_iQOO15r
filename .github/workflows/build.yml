name: Build xamonxx naga8gen5 driver

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - build_naga8gen5.sh
      - patches/**
      - .github/workflows/build.yml

permissions:
  contents: write

env:
  VERSION: "0.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [cool60, monster90, monster120, debug]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip flex bison git perl python3-pip glslang-tools curl zip pkg-config
          pip3 install --break-system-packages meson mako pyyaml

      - name: Build (perf flavor)
        id: perf
        continue-on-error: true
        run: FLAVOR=perf VARIANT=${{ matrix.variant }} bash build_naga8gen5.sh

      - name: Build (safe flavor fallback)
        if: steps.perf.outcome == 'failure'
        run: FLAVOR=safe VARIANT=${{ matrix.variant }} bash build_naga8gen5.sh

      - name: Collect output
        id: out
        run: |
          f=$(ls turnip_workdir/xamonxx_naga8gen5V${VERSION}-${{ matrix.variant }}*.zip | head -1)
          echo "zip=$f" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.variant }} (perf build: ${{ steps.perf.outcome }})" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -p "$f" meta.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: xamonxx_naga8gen5V${{ env.VERSION }}-${{ matrix.variant }}
          path: ${{ steps.out.outputs.zip }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VERSION}" out/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "xamonxx naga8gen5 V${VERSION}" \
            --notes "Turnip (Mesa) Vulkan driver for Snapdragon 8 Gen 5 / Adreno 829 (iQOO 15R), tuned for GTA V Legacy (DXVK).
          V${VERSION} modes (tuned from the V0.3 + V0.4 debug logs):
          - cool60: use game Target FPS 60 + V-Sync ON; 63 fps safety cap if the game is left Unlimited; GPU floor 60%, ADPF 16.7 ms.
          - monster90: game Target FPS Unlimited; 90 fps limiter, GPU at max allowed clock, ADPF; thermal guard on 6 s averages (GPU >= 92 C or CPU >= 100 C) steps the limit down 15 fps (min 75).
          - monster120: same as monster90 with a 120 fps limit and guard minimum 90. Hottest, short sessions.
          - debug: mode read from Download/xamonxx/mode.txt (cool60|monster90|monster120) + 1 CSV row/s (fps, frame time, GPU busy/clock, CPU clock, temps, current limit) in the same folder.
          Limits: a driver cannot set CPU clocks or temperature; ADPF is only a hint to Android and may be unavailable in the game process; thermal throttling always applies.
          LOAD segments aligned to 16 KiB. NOT TESTED on device yet."
